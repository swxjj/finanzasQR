<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8" />

  <!-- Inner Ambient Circle -->
  <circle cx="256" cy="256" r="180" fill="#10b981" fill-opacity="0.04" />

  <!-- Center QR Glyphs -->
  <g transform="translate(106, 106)" filter="url(#emeraldGlow)">
    <!-- Top-Left Finder Square -->
    <rect x="10" y="10" width="90" height="90" rx="20" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" />
    <rect x="35" y="35" width="40" height="40" rx="8" fill="#10b981" />

    <!-- Top-Right Finder Square -->
    <rect x="200" y="10" width="90" height="90" rx="20" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" />
    <rect x="225" y="35" width="40" height="40" rx="8" fill="#10b981" />

    <!-- Bottom-Left Finder Square -->
    <rect x="10" y="200" width="90" height="90" rx="20" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" />
    <rect x="35" y="225" width="40" height="40" rx="8" fill="#10b981" />

    <!-- Matrix Data Elements -->
    <path d="M150 20 V80 M20 150 H80 M150 150 H190 V190 H150 Z M210 150 H280 M150 210 V280 M210 230 H270 V270 H210 Z" stroke="#34d399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="150" cy="150" r="14" fill="#6ee7b7" />
  </g>
</svg>
